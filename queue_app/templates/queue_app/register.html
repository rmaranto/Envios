{% extends "queue_app/base.html" %}
{% block title %}Tomar turno{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h2 class="card-title mb-4 text-center">&#128203; Tomar mi turno</h2>

        {% if error %}
          <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="post" action="{% url 'queue_app:register' %}">
          {% csrf_token %}

          <div class="mb-3">
            <label for="name" class="form-label fw-semibold">Nombre completo</label>
            <input type="text" id="name" name="name" class="form-control form-control-lg"
                   placeholder="Tu nombre" required maxlength="100"
                   value="{{ request.POST.name|default:'' }}">
          </div>

          <div class="mb-4">
            <label for="phone" class="form-label fw-semibold">Teléfono celular</label>
            <input type="tel" id="phone" name="phone" class="form-control form-control-lg"
                   placeholder="+52XXXXXXXXXX" required maxlength="20"
                   value="{{ request.POST.phone|default:'' }}">
            <div class="form-text">Recibirás un SMS cuando sea tu turno. Formato: +52XXXXXXXXXX</div>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">Tomar mi turno</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
